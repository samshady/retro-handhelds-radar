<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retro Handhelds Radar: Sub-€100 Buyer's Guide &amp; Spec Matrix (2026)</title>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Font pairing: Bricolage Grotesque (display/headings) + Inter (body) + JetBrains Mono (data/specs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['"Bricolage Grotesque"', '"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            // Dark studio palette matching iem-radar
            studio: {
              950: '#0e0f13',
              900: '#14151b',
              850: '#1a1c24',
              800: '#222530',
              700: '#2d3140',
              600: '#3e4357',
              border: '#2a2e3d'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #0e0f13;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Typography scale */
    h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 2.25rem; line-height: 2.5rem; }
    h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.75rem; line-height: 2rem; }
    h3 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.25rem; line-height: 1.5rem; }

    /* Tactile studio card physics matching iem-radar */
    .studio-card {
      background-color: #14151b;
      border: 1px solid #2a2e3d;
      padding: 1.25rem;
      border-radius: 1rem;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .studio-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.5);
      border-color: #3e4357;
    }

    .btn-tactile {
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
    }
    .btn-tactile:hover {
      transform: translateY(-1px);
    }
    .btn-tactile:active {
      transform: scale(0.97);
    }

    /* Tabular numeric figures for prices & spec columns */
    .num-tabular {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    /* Prevent clipping when pills are highlighted */
    .filter-scroll-container {
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-top: 4px;
      padding-bottom: 4px;
    }
    .filter-scroll-container::-webkit-scrollbar {
      display: none;
    }

    /* Retro CRT Mode Scanlines Effect */
    body.crt-mode {
      position: relative;
    }
    body.crt-mode::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* Retro Pixel and Arcade Motif */
    .retro-badge {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0e0f13;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2e3d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3e4357;
    }
  </style>
</head>
<body class="bg-studio-950 text-slate-200 font-sans antialiased selection:bg-amber-400 selection:text-black min-h-screen">
