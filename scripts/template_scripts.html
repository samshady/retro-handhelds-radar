  <script>
    // Embedded dataset replaced at build time
    const HANDHELDS_DATA = __JSON_DATA__;

    let activeFilter = 'all';
    let searchQuery = '';
    let currentSort = 'price-asc';
    let isTableView = false;

    // DOM Elements
    const gridEl = document.getElementById('handheldGrid');
    const tableWrapperEl = document.getElementById('comparisonTableWrapper');
    const tableBodyEl = document.getElementById('comparisonTableBody');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const sortSelect = document.getElementById('sortSelect');
    const matchCountEl = document.getElementById('matchCount');
    const emptyStateEl = document.getElementById('emptyState');
    const viewToggleBtn = document.getElementById('viewToggleBtn');
    const viewIcon = document.getElementById('viewIcon');
    const viewText = document.getElementById('viewText');

    // Modal Elements
    const modalEl = document.getElementById('detailModal');
    const modalContent = document.getElementById('modalContent');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalDoneBtn = document.getElementById('modalDoneBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalFormFactor = document.getElementById('modalFormFactor');
    const modalImage = document.getElementById('modalImage');
    const modalTagline = document.getElementById('modalTagline');
    const modalVerdict = document.getElementById('modalVerdict');
    const modalPriceAliChoice = document.getElementById('modalPriceAliChoice');
    const modalPrice1111 = document.getElementById('modalPrice1111');
    const modalPriceRetail = document.getElementById('modalPriceRetail');
    const modalDisplay = document.getElementById('modalDisplay');
    const modalChipset = document.getElementById('modalChipset');
    const modalCeiling = document.getElementById('modalCeiling');
    const modalPortMaster = document.getElementById('modalPortMaster');
    const modalControls = document.getElementById('modalControls');
    const modalBattery = document.getElementById('modalBattery');
    const modalPros = document.getElementById('modalPros');
    const modalCons = document.getElementById('modalCons');

    function fmtPrice(val) {
      if (!val) return 'N/A';
      return '€' + Number(val).toFixed(2);
    }

    function getFilteredAndSorted() {
      let filtered = HANDHELDS_DATA.filter(item => {
        // Form factor
        if (activeFilter !== 'all') {
          if (activeFilter === 'Vertical' && item.form_factor !== 'Vertical') return false;
          if (activeFilter === 'Horizontal' && item.form_factor !== 'Horizontal') return false;
          if (activeFilter === 'Clamshell' && item.form_factor !== 'Clamshell') return false;
          if (activeFilter === 'Square' && !item.form_factor.includes('Square')) return false;
          if (activeFilter === 'Pocket Micro' && !item.form_factor.includes('Micro')) return false;
        }

        // Search query
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          const matches = (
            item.name.toLowerCase().includes(q) ||
            item.chipset.toLowerCase().includes(q) ||
            item.display.toLowerCase().includes(q) ||
            item.resolution.toLowerCase().includes(q) ||
            item.recommended_os.toLowerCase().includes(q) ||
            item.emulation_ceiling.toLowerCase().includes(q) ||
            item.tagline.toLowerCase().includes(q)
          );
          if (!matches) return false;
        }

        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (currentSort === 'price-asc') return a.price_eur_ali_1111 - b.price_eur_ali_1111;
        if (currentSort === 'price-desc') return b.price_eur_ali_choice - a.price_eur_ali_choice;
        if (currentSort === 'name-asc') return a.name.localeCompare(b.name);
        if (currentSort === 'res-desc') return (b.ppi || 0) - (a.ppi || 0);
        return 0;
      });

      return filtered;
    }

    // Render Cards in Studio Style with Product Images
    function renderGrid(items) {
      gridEl.innerHTML = '';
      if (items.length === 0) {
        emptyStateEl.classList.remove('hidden');
        return;
      }
      emptyStateEl.classList.add('hidden');

      items.forEach(item => {
        const card = document.createElement('article');
        card.className = 'studio-card rounded-2xl p-5 flex flex-col justify-between group';

        card.innerHTML = `
          <div class="space-y-4">
            <!-- Product Photo Container matching IEM card style -->
            <div class="aspect-[4/3] bg-studio-950 rounded-xl overflow-hidden relative cursor-pointer border border-studio-border/70 flex items-center justify-center p-3" onclick="openModal('${item.id}')">
              <img 
                src="${item.image || 'assets/images/' + item.id + '.jpg'}" 
                alt="${item.name}" 
                class="w-full h-full object-contain"
                loading="lazy"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
              >
              <div class="hidden absolute inset-0 items-center justify-center text-4xl text-slate-600 bg-studio-900">
                <i class="fa-solid fa-gamepad"></i>
              </div>

              <!-- Badges on Image -->
              <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded-md bg-studio-900/90 backdrop-blur-sm text-amber-300 border border-studio-border text-xs font-mono font-semibold">
                  ${item.form_factor}
                </span>
                <span class="px-2 py-0.5 rounded-md bg-studio-900/90 backdrop-blur-sm text-slate-300 border border-studio-border text-xs font-mono">
                  ${item.resolution}
                </span>
              </div>
            </div>

            <!-- Title & Tagline -->
            <div>
              <div class="flex items-baseline justify-between gap-2">
                <h3 class="text-xl font-display font-bold text-white group-hover:text-amber-300 transition-colors">
                  ${item.name}
                </h3>
                <span class="text-xs font-mono text-slate-400 shrink-0">${item.brand}</span>
              </div>
              <p class="text-xs text-slate-300 mt-1 line-clamp-2 leading-relaxed">
                ${item.tagline}
              </p>
            </div>

            <!-- Specs Matrix (High-legibility 12px text, no nested card boxes) -->
            <div class="grid grid-cols-2 gap-x-3 gap-y-2 text-xs font-mono pt-3 border-t border-studio-border">
              <div>
                <span class="text-slate-400 block text-xs">Chipset</span>
                <span class="text-slate-200 font-medium truncate block">${item.chipset}</span>
              </div>
              <div>
                <span class="text-slate-400 block text-xs">Display</span>
                <span class="text-slate-200 font-medium truncate block">${item.display} (${item.aspect_ratio})</span>
              </div>
              <div>
                <span class="text-slate-400 block text-xs">Ceiling</span>
                <span class="text-amber-400 font-medium truncate block">${item.emulation_ceiling.split(',')[0]}</span>
              </div>
              <div>
                <span class="text-slate-400 block text-xs">Recommended OS</span>
                <span class="text-emerald-400 font-medium truncate block">${item.recommended_os}</span>
              </div>
            </div>
          </div>

          <!-- Price & Action Footer -->
          <div class="pt-4 mt-4 border-t border-studio-border flex items-center justify-between gap-3">
            <div>
              <div class="text-xs font-mono text-slate-400">Choice / 11.11 Promo</div>
              <div class="font-mono font-bold text-emerald-400 text-base num-tabular">
                ${fmtPrice(item.price_eur_ali_choice)} <span class="text-xs font-normal text-amber-400">(${fmtPrice(item.price_eur_ali_1111)})</span>
              </div>
            </div>
            <button type="button" onclick="openModal('${item.id}')" class="btn-tactile min-h-[44px] px-3.5 py-2 rounded-xl bg-studio-900 hover:bg-amber-400 hover:text-black text-xs font-mono text-slate-200 border border-studio-border flex items-center gap-1.5 transition">
              <span>Inspect</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    // Render Table
    function renderTable(items) {
      tableBodyEl.innerHTML = '';
      if (items.length === 0) {
        emptyStateEl.classList.remove('hidden');
        return;
      }
      emptyStateEl.classList.add('hidden');

      items.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-studio-850/60 transition-colors';
        tr.innerHTML = `
          <td class="py-3 px-3 font-bold text-white font-display flex items-center gap-2">
            <img src="${item.image || 'assets/images/' + item.id + '.jpg'}" alt="" class="w-8 h-8 rounded object-contain bg-studio-950 border border-studio-border p-0.5 shrink-0" onerror="this.style.display='none'">
            <span>${item.name}</span>
          </td>
          <td class="py-3 px-3 text-slate-400">${item.form_factor}</td>
          <td class="py-3 px-3 text-slate-300">${item.display} (${item.resolution})</td>
          <td class="py-3 px-3 text-slate-300">${item.chipset}</td>
          <td class="py-3 px-3 text-amber-400">${item.emulation_ceiling}</td>
          <td class="py-3 px-3 text-emerald-400">${item.recommended_os}</td>
          <td class="py-3 px-3 text-emerald-400 font-bold num-tabular">${fmtPrice(item.price_eur_ali_choice)}</td>
          <td class="py-3 px-3 text-amber-400 font-bold num-tabular">${fmtPrice(item.price_eur_ali_1111)}</td>
          <td class="py-3 px-3 text-right">
            <button type="button" onclick="openModal('${item.id}')" class="btn-tactile min-h-[36px] px-3 py-1 rounded-lg bg-studio-900 hover:bg-amber-400 hover:text-black text-slate-200 text-xs border border-studio-border">
              View
            </button>
          </td>
        `;
        tableBodyEl.appendChild(tr);
      });
    }

    function updateUI() {
      const items = getFilteredAndSorted();
      matchCountEl.textContent = items.length;
      if (isTableView) {
        renderTable(items);
      } else {
        renderGrid(items);
      }
    }

    function openModal(id) {
      const item = HANDHELDS_DATA.find(h => h.id === id);
      if (!item) return;

      modalTitle.textContent = item.name;
      modalFormFactor.textContent = item.form_factor;
      modalImage.src = item.image || `assets/images/${item.id}.jpg`;
      modalImage.alt = item.name;
      modalTagline.textContent = item.tagline;
      modalVerdict.textContent = item.verdict;
      modalPriceAliChoice.textContent = fmtPrice(item.price_eur_ali_choice);
      modalPrice1111.textContent = fmtPrice(item.price_eur_ali_1111);
      modalPriceRetail.textContent = fmtPrice(item.price_eur_retail);
      modalDisplay.textContent = `${item.display} • ${item.resolution} (${item.aspect_ratio}, ${item.ppi} ppi)`;
      modalChipset.textContent = `${item.chipset} (${item.cpu_detail}) • ${item.ram}`;
      modalCeiling.textContent = item.emulation_ceiling;
      modalPortMaster.textContent = item.portmaster;
      modalControls.textContent = item.controls;
      modalBattery.textContent = item.battery;

      modalPros.innerHTML = '';
      (item.pros || []).forEach(p => {
        const li = document.createElement('li');
        li.textContent = p;
        modalPros.appendChild(li);
      });

      modalCons.innerHTML = '';
      (item.cons || []).forEach(c => {
        const li = document.createElement('li');
        li.textContent = c;
        modalCons.appendChild(li);
      });

      modalEl.classList.remove('hidden');
      setTimeout(() => {
        modalContent.classList.remove('translate-x-full');
      }, 10);
      document.body.classList.add('overflow-hidden');
    }

    function closeModal() {
      modalContent.classList.add('translate-x-full');
      setTimeout(() => {
        modalEl.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
      }, 250);
    }

    function resetFilters() {
      activeFilter = 'all';
      searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      document.querySelectorAll('.form-filter-btn').forEach(btn => {
        const isAll = btn.dataset.filter === 'all';
        btn.classList.toggle('bg-amber-400', isAll);
        btn.classList.toggle('text-black', isAll);
        btn.classList.toggle('font-bold', isAll);
        btn.classList.toggle('border-amber-400', isAll);
        btn.classList.toggle('bg-studio-900', !isAll);
        btn.classList.toggle('text-slate-300', !isAll);
        btn.classList.toggle('border-studio-border', !isAll);
      });
      updateUI();
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      searchInput.addEventListener('input', e => {
        searchQuery = e.target.value;
        clearSearchBtn.classList.toggle('hidden', searchQuery === '');
        updateUI();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        updateUI();
      });

      sortSelect.addEventListener('change', e => {
        currentSort = e.target.value;
        updateUI();
      });

      // Filter pills
      document.querySelectorAll('.form-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.form-filter-btn').forEach(b => {
            b.classList.remove('bg-amber-400', 'text-black', 'font-bold', 'border-amber-400');
            b.classList.add('bg-studio-900', 'text-slate-300', 'border-studio-border');
          });
          btn.classList.add('bg-amber-400', 'text-black', 'font-bold', 'border-amber-400');
          btn.classList.remove('bg-studio-900', 'text-slate-300', 'border-studio-border');
          activeFilter = btn.dataset.filter;
          updateUI();
        });
      });

      // Toggle Table / Grid
      viewToggleBtn.addEventListener('click', () => {
        isTableView = !isTableView;
        if (isTableView) {
          gridEl.classList.add('hidden');
          tableWrapperEl.classList.remove('hidden');
          viewIcon.className = 'fa-solid fa-border-all text-amber-400';
          viewText.textContent = 'Grid View';
        } else {
          gridEl.classList.remove('hidden');
          tableWrapperEl.classList.add('hidden');
          viewIcon.className = 'fa-solid fa-table-list text-amber-400';
          viewText.textContent = 'Compare Table';
        }
        updateUI();
      });

      closeModalBtn.addEventListener('click', closeModal);
      modalDoneBtn.addEventListener('click', closeModal);
      modalEl.addEventListener('click', e => {
        if (e.target === modalEl) closeModal();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !modalEl.classList.contains('hidden')) {
          closeModal();
        }
      });

      updateUI();
    });
  </script>
</body>
</html>
