  <script>
    // Embedded dataset replaced at build time
    const HANDHELDS_DATA = __JSON_DATA__;

    let activeFilter = 'all';
    let searchQuery = '';
    let currentSort = 'price-asc';
    let isTableView = false;

    // DOM Elements
    const gridEl = document.getElementById('handheldGrid');
    const tableWrapperEl = document.getElementById('comparisonTableWrapper');
    const tableBodyEl = document.getElementById('comparisonTableBody');
    const comparisonMobileCardsEl = document.getElementById('comparisonMobileCards');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const sortSelect = document.getElementById('sortSelect');
    const matchCountEl = document.getElementById('matchCount');
    const emptyStateEl = document.getElementById('emptyState');
    const viewToggleBtn = document.getElementById('viewToggleBtn');
    const viewIcon = document.getElementById('viewIcon');
    const viewText = document.getElementById('viewText');

    // Modal Elements
    const modalEl = document.getElementById('detailModal');
    const modalContent = document.getElementById('modalContent');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalDoneBtn = document.getElementById('modalDoneBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalFormFactor = document.getElementById('modalFormFactor');
    const modalImage = document.getElementById('modalImage');
    const modalTagline = document.getElementById('modalTagline');
    const modalVerdict = document.getElementById('modalVerdict');
    const modalPriceAliChoice = document.getElementById('modalPriceAliChoice');
    const modalPrice1111 = document.getElementById('modalPrice1111');
    const modalPriceRetail = document.getElementById('modalPriceRetail');
    const modalDisplay = document.getElementById('modalDisplay');
    const modalChipset = document.getElementById('modalChipset');
    const modalCeiling = document.getElementById('modalCeiling');
    const modalPortMaster = document.getElementById('modalPortMaster');
    const modalControls = document.getElementById('modalControls');
    const modalBattery = document.getElementById('modalBattery');
    const modalPros = document.getElementById('modalPros');
    const modalCons = document.getElementById('modalCons');
    const modalStoresContainer = document.getElementById('modalStoresContainer');
    const modalChipPips = document.getElementById('modalChipPips');
    const modalEmuPips = document.getElementById('modalEmuPips');
    const modalPicoPips = document.getElementById('modalPicoPips');
    const modalPortPips = document.getElementById('modalPortPips');
    const modalReviewChannel = document.getElementById('modalReviewChannel');
    const modalReviewTitle = document.getElementById('modalReviewTitle');
    const modalReviewLinks = document.getElementById('modalReviewLinks');
    const modalBuyingAdvice = document.getElementById('modalBuyingAdvice');
    const crtToggleBtn = document.getElementById('crtToggleBtn');

    function fmtPrice(val) {
      if (!val) return 'N/A';
      return '€' + Number(val).toFixed(2);
    }

    function renderRetroPips(score, maxScore = 5, activeColor = 'bg-amber-400') {
      let pips = '';
      for (let i = 1; i <= maxScore; i++) {
        const active = i <= (score || 0);
        pips += `<span class="w-2.5 h-1.5 rounded-[1px] ${active ? activeColor : 'bg-studio-800 border border-studio-border/60'} inline-block"></span>`;
      }
      return `<div class="flex items-center gap-1">${pips} <span class="text-xs font-mono font-bold text-slate-300 ml-1 num-tabular">${score || 0}/${maxScore}</span></div>`;
    }

    function getFilteredAndSorted() {
      let filtered = HANDHELDS_DATA.filter(item => {
        // Form factor & capability filters
        if (activeFilter !== 'all') {
          if (activeFilter === 'portmaster' && (item.portmaster_score || 0) < 4) return false;
          if (activeFilter === 'pico8' && (item.pico8_score || 0) < 4) return false;
          if (activeFilter === 'Vertical' && item.form_factor !== 'Vertical') return false;
          if (activeFilter === 'Horizontal' && item.form_factor !== 'Horizontal') return false;
          if (activeFilter === 'Clamshell' && item.form_factor !== 'Clamshell') return false;
          if (activeFilter === 'Square' && !item.form_factor.includes('Square')) return false;
          if (activeFilter === 'Pocket Micro' && !item.form_factor.includes('Micro')) return false;
        }

        // Search query
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          const matches = (
            item.name.toLowerCase().includes(q) ||
            item.chipset.toLowerCase().includes(q) ||
            item.display.toLowerCase().includes(q) ||
            item.resolution.toLowerCase().includes(q) ||
            item.recommended_os.toLowerCase().includes(q) ||
            item.emulation_ceiling.toLowerCase().includes(q) ||
            (item.portmaster_tier && item.portmaster_tier.toLowerCase().includes(q)) ||
            (item.pico8_tier && item.pico8_tier.toLowerCase().includes(q)) ||
            item.tagline.toLowerCase().includes(q)
          );
          if (!matches) return false;
        }

        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (currentSort === 'price-asc') return (a.price_eur_ali_1111 || 0) - (b.price_eur_ali_1111 || 0);
        if (currentSort === 'price-desc') return (b.price_eur_ali_choice || 0) - (a.price_eur_ali_choice || 0);
        if (currentSort === 'emu-desc') return (b.emulation_score || 0) - (a.emulation_score || 0) || (a.price_eur_ali_choice - b.price_eur_ali_choice);
        if (currentSort === 'chip-desc') return (b.chip_score || 0) - (a.chip_score || 0) || (a.price_eur_ali_choice - b.price_eur_ali_choice);
        if (currentSort === 'pico-desc') return (b.pico8_score || 0) - (a.pico8_score || 0) || (a.price_eur_ali_choice - b.price_eur_ali_choice);
        if (currentSort === 'port-desc') return (b.portmaster_score || 0) - (a.portmaster_score || 0) || (a.price_eur_ali_choice - b.price_eur_ali_choice);
        if (currentSort === 'name-asc') return a.name.localeCompare(b.name);
        if (currentSort === 'res-desc') return (b.ppi || 0) - (a.ppi || 0);
        return 0;
      });

      return filtered;
    }

    // Render Cards in Studio Style with Product Images
    function renderGrid(items) {
      gridEl.innerHTML = '';
      if (items.length === 0) {
        emptyStateEl.classList.remove('hidden');
        return;
      }
      emptyStateEl.classList.add('hidden');

      items.forEach(item => {
        const card = document.createElement('article');
        card.className = 'studio-card rounded-2xl p-5 flex flex-col justify-between group';

        card.innerHTML = `
          <div class="space-y-4">
            <!-- Product Photo Container matching IEM card style -->
            <div class="aspect-[4/3] bg-studio-950 rounded-xl overflow-hidden relative cursor-pointer border border-studio-border/70 flex items-center justify-center p-3" onclick="openModal('${item.id}')">
              <img 
                src="${item.image || 'assets/images/' + item.id + '.jpg'}" 
                alt="${item.name}" 
                class="w-full h-full object-contain"
                loading="lazy"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
              >
              <div class="hidden absolute inset-0 items-center justify-center text-4xl text-slate-600 bg-studio-900">
                <i class="fa-solid fa-gamepad"></i>
              </div>

              <!-- Badges on Image -->
              <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded-md bg-studio-900/90 backdrop-blur-sm text-amber-300 border border-studio-border text-xs font-mono font-semibold">
                  ${item.form_factor}
                </span>
                <span class="px-2 py-0.5 rounded-md bg-studio-900/90 backdrop-blur-sm text-slate-300 border border-studio-border text-xs font-mono">
                  ${item.resolution}
                </span>
              </div>
            </div>

            <!-- Title & Tagline -->
            <div>
              <div class="flex items-baseline justify-between gap-2">
                <h3 class="text-xl font-display font-bold text-white group-hover:text-amber-300 transition-colors cursor-pointer" onclick="openModal('${item.id}')">
                  ${item.name}
                </h3>
                <span class="text-xs font-mono text-slate-400 shrink-0">${item.brand}</span>
              </div>
              <p class="text-xs text-slate-300 mt-1 leading-relaxed">
                ${item.tagline}
              </p>
            </div>

            <!-- Retro Benchmark Scoring Matrix (5-Pip LED Bars) -->
            <div class="space-y-1.5 text-xs font-mono pt-3 border-t border-studio-border">
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">Emulation Ceiling</span>
                ${renderRetroPips(item.emulation_score, 5, 'bg-amber-400')}
              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">Chipset Muscle</span>
                ${renderRetroPips(item.chip_score, 5, 'bg-sky-400')}
              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">PICO-8 Support</span>
                ${renderRetroPips(item.pico8_score, 5, 'bg-purple-400')}
              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">PortMaster 64-bit</span>
                ${renderRetroPips(item.portmaster_score, 5, 'bg-emerald-400')}
              </div>

              <!-- Quick Hardware Strip -->
              <div class="grid grid-cols-2 gap-2 pt-2 border-t border-studio-border/50 text-xs text-slate-300">
                <span class="truncate"><i class="fa-solid fa-microchip text-slate-400 mr-1"></i>${item.chipset}</span>
                <span class="truncate"><i class="fa-solid fa-tv text-slate-400 mr-1"></i>${item.display} (${item.aspect_ratio})</span>
              </div>
            </div>
          </div>

          <!-- Price & Action Footer -->
          <div class="pt-4 mt-4 border-t border-studio-border flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="text-xs font-mono text-slate-400">Choice / 11.11 Promo</div>
              <div class="font-mono font-bold text-emerald-400 text-base num-tabular">
                ${fmtPrice(item.price_eur_ali_choice)} <span class="text-xs font-normal text-amber-400">(${fmtPrice(item.price_eur_ali_1111)})</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${item.review_url ? `
                <a href="${item.review_url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] min-w-[44px] px-2.5 py-2 rounded-xl bg-studio-900 hover:bg-studio-800 text-xs font-mono text-slate-300 border border-studio-border flex items-center justify-center gap-1.5 transition" title="Watch ${item.review_channel} Review">
                  <i class="fa-brands fa-youtube text-rose-500 text-xs"></i>
                  <span class="hidden sm:inline">Review</span>
                </a>
              ` : ''}
              ${(item.verified_stores && item.verified_stores.length > 0) ? `
                <a href="${item.verified_stores[0].url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] px-3 py-2 rounded-xl bg-amber-400 text-black hover:bg-amber-300 text-xs font-mono font-bold flex items-center gap-1.5 shadow-sm" title="View deals on ${item.verified_stores[0].name}">
                  <i class="fa-solid fa-cart-shopping text-xs"></i>
                  <span>Deals</span>
                </a>
              ` : ''}
              <button type="button" onclick="openModal('${item.id}')" class="btn-tactile min-h-[44px] px-3 py-2 rounded-xl bg-studio-900 hover:bg-studio-800 text-xs font-mono text-slate-200 border border-studio-border flex items-center gap-1.5 transition">
                <span>Specs</span>
                <i class="fa-solid fa-arrow-right text-xs text-amber-400"></i>
              </button>
            </div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    // Render Table
    function renderTable(items) {
      tableBodyEl.innerHTML = '';
      if (comparisonMobileCardsEl) comparisonMobileCardsEl.innerHTML = '';

      if (items.length === 0) {
        emptyStateEl.classList.remove('hidden');
        return;
      }
      emptyStateEl.classList.add('hidden');

      items.forEach(item => {
        // Desktop Table Row
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-studio-850/60 transition-colors';
        tr.innerHTML = `
          <td class="py-3 px-3 font-bold text-white font-display flex items-center gap-2">
            <img src="${item.image || 'assets/images/' + item.id + '.jpg'}" alt="" class="w-8 h-8 rounded object-contain bg-studio-950 border border-studio-border p-0.5 shrink-0" onerror="this.style.display='none'">
            <span>${item.name}</span>
          </td>
          <td class="py-3 px-3 text-slate-300">${item.display} (${item.aspect_ratio})</td>
          <td class="py-3 px-3">${renderRetroPips(item.chip_score, 5, 'bg-sky-400')}</td>
          <td class="py-3 px-3">${renderRetroPips(item.emulation_score, 5, 'bg-amber-400')}</td>
          <td class="py-3 px-3"><span class="px-2 py-0.5 rounded text-xs font-bold ${item.pico8_score >= 4 ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40' : item.pico8_score === 3 ? 'bg-studio-800 text-slate-300 border border-studio-border' : 'bg-studio-900 text-slate-400 border border-studio-border/60'}">${item.pico8_score >= 5 ? 'Splore' : item.pico8_score === 4 ? 'Native' : item.pico8_score === 3 ? 'Fake08' : 'No'}</span></td>
          <td class="py-3 px-3"><span class="px-2 py-0.5 rounded text-xs font-bold ${item.portmaster_score >= 4 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : item.portmaster_score === 3 ? 'bg-studio-800 text-slate-300 border border-studio-border' : 'bg-studio-900 text-slate-400 border border-studio-border/60'}">${item.portmaster_score >= 4 ? '64-bit' : item.portmaster_score === 3 ? 'Light' : 'No'}</span></td>
          <td class="py-3 px-3 text-emerald-400 font-bold num-tabular">${fmtPrice(item.price_eur_ali_choice)}</td>
          <td class="py-3 px-3 text-amber-400 font-bold num-tabular">${fmtPrice(item.price_eur_ali_1111)}</td>
          <td class="py-3 px-3 text-right">
            <div class="flex items-center justify-end gap-1.5">
              ${item.review_url ? `
                <a href="${item.review_url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] px-3 py-2 rounded-xl bg-studio-900 hover:bg-studio-800 text-slate-300 border border-studio-border font-mono text-xs inline-flex items-center gap-1.5" title="Watch ${item.review_channel} Review">
                  <i class="fa-brands fa-youtube text-rose-500 text-xs"></i>
                  <span>Review</span>
                </a>
              ` : ''}
              ${(item.verified_stores && item.verified_stores.length > 0) ? `
                <a href="${item.verified_stores[0].url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] px-3 py-2 rounded-xl bg-amber-400 text-black hover:bg-amber-300 font-mono text-xs font-bold inline-flex items-center gap-1.5 shadow-sm">
                  <i class="fa-solid fa-cart-shopping text-xs"></i>
                  <span>Deal</span>
                </a>
              ` : ''}
              <button type="button" onclick="openModal('${item.id}')" class="btn-tactile min-h-[44px] px-3 py-2 rounded-xl bg-studio-900 hover:bg-studio-800 text-slate-200 text-xs border border-studio-border font-mono">
                Specs
              </button>
            </div>
          </td>
        `;
        tableBodyEl.appendChild(tr);

        // Mobile Stacked Comparison Card (<= 700px)
        if (comparisonMobileCardsEl) {
          const mCard = document.createElement('div');
          mCard.className = 'p-4 rounded-xl bg-studio-950 border border-studio-border space-y-3';
          mCard.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <img src="${item.image || 'assets/images/' + item.id + '.jpg'}" alt="" class="w-10 h-10 rounded-lg object-contain bg-studio-900 border border-studio-border p-1 shrink-0" onerror="this.style.display='none'">
                <div class="min-w-0">
                  <div class="font-bold text-white font-display text-sm truncate cursor-pointer hover:underline" onclick="openModal('${item.id}')">${item.name}</div>
                  <div class="text-xs text-slate-400 font-mono">${item.display} (${item.aspect_ratio})</div>
                </div>
              </div>
              <div class="text-right shrink-0">
                <div class="text-xs font-mono text-emerald-400 font-bold num-tabular">${fmtPrice(item.price_eur_ali_choice)}</div>
                <div class="text-xs font-mono text-amber-400 num-tabular">${fmtPrice(item.price_eur_ali_1111)}</div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs font-mono bg-studio-900/60 p-2.5 rounded-lg border border-studio-border/50">
              <div>
                <span class="text-slate-400 block text-xs">Chip Muscle</span>
                ${renderRetroPips(item.chip_score, 5, 'bg-sky-400')}
              </div>
              <div>
                <span class="text-slate-400 block text-xs">Emulation</span>
                ${renderRetroPips(item.emulation_score, 5, 'bg-amber-400')}
              </div>
              <div class="pt-1 border-t border-studio-border/40">
                <span class="text-slate-400 block text-xs">PICO-8</span>
                <span class="px-2 py-0.5 rounded text-xs font-bold inline-block mt-0.5 ${item.pico8_score >= 4 ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40' : item.pico8_score === 3 ? 'bg-studio-800 text-slate-300 border border-studio-border' : 'bg-studio-900 text-slate-400 border border-studio-border/60'}">${item.pico8_score >= 5 ? 'Splore' : item.pico8_score === 4 ? 'Native' : item.pico8_score === 3 ? 'Fake08' : 'No'}</span>
              </div>
              <div class="pt-1 border-t border-studio-border/40">
                <span class="text-slate-400 block text-xs">PortMaster</span>
                <span class="px-2 py-0.5 rounded text-xs font-bold inline-block mt-0.5 ${item.portmaster_score >= 4 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : item.portmaster_score === 3 ? 'bg-studio-800 text-slate-300 border border-studio-border' : 'bg-studio-900 text-slate-400 border border-studio-border/60'}">${item.portmaster_score >= 4 ? '64-bit' : item.portmaster_score === 3 ? 'Light' : 'No'}</span>
              </div>
            </div>

            <div class="flex items-center gap-2 pt-1">
              ${item.review_url ? `
                <a href="${item.review_url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] px-3 py-2 rounded-xl bg-studio-900 hover:bg-studio-800 text-slate-300 border border-studio-border font-mono text-xs inline-flex items-center justify-center gap-1.5 grow" title="Watch ${item.review_channel} Review">
                  <i class="fa-brands fa-youtube text-rose-500 text-xs"></i>
                  <span>Review</span>
                </a>
              ` : ''}
              ${(item.verified_stores && item.verified_stores.length > 0) ? `
                <a href="${item.verified_stores[0].url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] px-3 py-2 rounded-xl bg-amber-400 text-black hover:bg-amber-300 font-mono text-xs font-bold inline-flex items-center justify-center gap-1.5 shadow-sm grow">
                  <i class="fa-solid fa-cart-shopping text-xs"></i>
                  <span>Deal</span>
                </a>
              ` : ''}
              <button type="button" onclick="openModal('${item.id}')" class="btn-tactile min-h-[44px] px-3 py-2 rounded-xl bg-studio-900 hover:bg-studio-800 text-slate-200 text-xs border border-studio-border font-mono inline-flex items-center justify-center gap-1.5 grow">
                <span>Specs</span>
                <i class="fa-solid fa-arrow-right text-xs text-amber-400"></i>
              </button>
            </div>
          `;
          comparisonMobileCardsEl.appendChild(mCard);
        }
      });
    }

    function updateUI() {
      const items = getFilteredAndSorted();
      matchCountEl.textContent = items.length;
      if (isTableView) {
        renderTable(items);
      } else {
        renderGrid(items);
      }
    }

    let previousActiveElement = null;

    function openModal(id) {
      const item = HANDHELDS_DATA.find(h => h.id === id);
      if (!item) return;

      previousActiveElement = document.activeElement;

      modalTitle.textContent = item.name;
      modalFormFactor.textContent = item.form_factor;
      modalImage.src = item.image || `assets/images/${item.id}.jpg`;
      modalImage.alt = item.name;
      modalTagline.textContent = item.tagline;
      modalVerdict.textContent = item.verdict;
      modalPriceAliChoice.textContent = fmtPrice(item.price_eur_ali_choice);
      modalPrice1111.textContent = fmtPrice(item.price_eur_ali_1111);
      modalPriceRetail.textContent = fmtPrice(item.price_eur_retail);
      modalDisplay.textContent = `${item.display} • ${item.resolution} (${item.aspect_ratio}, ${item.ppi} ppi)`;
      modalChipset.textContent = `${item.chipset} (${item.cpu_detail}) • ${item.ram}`;
      modalCeiling.textContent = item.emulation_ceiling;
      modalPortMaster.textContent = item.portmaster;
      modalControls.textContent = item.controls;
      modalBattery.textContent = item.battery;

      if (modalChipPips) modalChipPips.innerHTML = renderRetroPips(item.chip_score, 5, 'bg-sky-400');
      if (modalEmuPips) modalEmuPips.innerHTML = renderRetroPips(item.emulation_score, 5, 'bg-amber-400');
      if (modalPicoPips) modalPicoPips.innerHTML = renderRetroPips(item.pico8_score, 5, 'bg-purple-400') + (item.pico8_tier ? `<span class="text-xs text-slate-400 font-mono block mt-0.5">${item.pico8_tier}</span>` : '');
      if (modalPortPips) modalPortPips.innerHTML = renderRetroPips(item.portmaster_score, 5, 'bg-emerald-400') + (item.portmaster_tier ? `<span class="text-xs text-slate-400 font-mono block mt-0.5">${item.portmaster_tier}</span>` : '');

      modalPros.innerHTML = '';
      (item.pros || []).forEach(p => {
        const li = document.createElement('li');
        li.textContent = p;
        modalPros.appendChild(li);
      });

      modalCons.innerHTML = '';
      (item.cons || []).forEach(c => {
        const li = document.createElement('li');
        li.textContent = c;
        modalCons.appendChild(li);
      });

      if (modalReviewChannel) modalReviewChannel.textContent = `${item.review_channel || 'Retro Game Corps'} Review`;
      if (modalReviewTitle) modalReviewTitle.textContent = item.review_title || `${item.name} In-Depth Overview`;
      if (modalReviewLinks) {
        let linksHtml = '';
        if (item.review_url) {
          linksHtml += `
            <a href="${item.review_url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] px-3.5 py-2.5 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/40 text-xs font-mono font-bold inline-flex items-center gap-1.5 shadow-sm">
              <i class="fa-brands fa-youtube text-rose-400 text-sm"></i>
              <span>Watch Video Review</span>
            </a>
          `;
        }
        if (item.guide_url && item.guide_url !== 'https://retrogamecorps.com/') {
          linksHtml += `
            <a href="${item.guide_url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] px-3.5 py-2.5 rounded-xl bg-studio-900 hover:bg-studio-800 text-slate-200 border border-studio-border text-xs font-mono font-bold inline-flex items-center gap-1.5">
              <i class="fa-solid fa-book-open text-emerald-400"></i>
              <span>Written Setup Guide</span>
            </a>
          `;
        }
        modalReviewLinks.innerHTML = linksHtml;
      }
      if (modalBuyingAdvice) {
        modalBuyingAdvice.textContent = item.buying_advice || 'Check AliExpress Choice for lowest delivered pricing under €150 with prepaid IOSS VAT.';
      }

      if (modalStoresContainer) {
        modalStoresContainer.innerHTML = (item.verified_stores || []).map(store => `
          <a href="${store.url}" target="_blank" rel="noopener noreferrer" class="btn-tactile min-h-[44px] px-3.5 py-2.5 rounded-xl bg-studio-950 hover:bg-studio-800 text-slate-200 border border-studio-border text-xs font-mono font-semibold transition flex items-center justify-between gap-2 grow sm:grow-0">
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-arrow-up-right-from-square text-xs text-amber-400"></i>
              <span>${store.name}</span>
            </span>
            ${store.badge ? `<span class="px-2 py-0.5 rounded text-xs bg-studio-900 text-emerald-400 border border-studio-border font-medium">${store.badge}</span>` : ''}
          </a>
        `).join('');
      }

      const mainEl = document.querySelector('main');
      if (mainEl) mainEl.setAttribute('aria-hidden', 'true');

      modalEl.classList.remove('hidden');
      setTimeout(() => {
        modalContent.classList.remove('translate-x-full');
        if (closeModalBtn) closeModalBtn.focus();
      }, 20);
      document.body.classList.add('overflow-hidden');
    }

    function closeModal() {
      modalContent.classList.add('translate-x-full');
      setTimeout(() => {
        modalEl.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
        const mainEl = document.querySelector('main');
        if (mainEl) mainEl.removeAttribute('aria-hidden');
        if (previousActiveElement && typeof previousActiveElement.focus === 'function') {
          previousActiveElement.focus();
        }
      }, 250);
    }

    function resetFilters() {
      activeFilter = 'all';
      searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      document.querySelectorAll('.form-filter-btn').forEach(btn => {
        const isAll = btn.dataset.filter === 'all';
        btn.classList.toggle('bg-amber-400', isAll);
        btn.classList.toggle('text-black', isAll);
        btn.classList.toggle('font-bold', isAll);
        btn.classList.toggle('border-amber-400', isAll);
        btn.classList.toggle('bg-studio-900', !isAll);
        btn.classList.toggle('text-slate-300', !isAll);
        btn.classList.toggle('border-studio-border', !isAll);
      });
      updateUI();
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      searchInput.addEventListener('input', e => {
        searchQuery = e.target.value;
        clearSearchBtn.classList.toggle('hidden', searchQuery === '');
        updateUI();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        updateUI();
      });

      sortSelect.addEventListener('change', e => {
        currentSort = e.target.value;
        updateUI();
      });

      // Filter pills
      document.querySelectorAll('.form-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.form-filter-btn').forEach(b => {
            b.classList.remove('bg-amber-400', 'text-black', 'font-bold', 'border-amber-400');
            b.classList.add('bg-studio-900', 'text-slate-300', 'border-studio-border');
          });
          btn.classList.add('bg-amber-400', 'text-black', 'font-bold', 'border-amber-400');
          btn.classList.remove('bg-studio-900', 'text-slate-300', 'border-studio-border');
          activeFilter = btn.dataset.filter;
          updateUI();
        });
      });

      // Toggle Table / Grid
      viewToggleBtn.addEventListener('click', () => {
        isTableView = !isTableView;
        viewToggleBtn.setAttribute('aria-pressed', isTableView ? 'true' : 'false');
        viewToggleBtn.setAttribute('aria-label', isTableView ? 'Switch to Grid View' : 'Switch to Compare Table View');
        if (isTableView) {
          gridEl.classList.add('hidden');
          tableWrapperEl.classList.remove('hidden');
          viewIcon.className = 'fa-solid fa-border-all text-amber-400';
          viewText.textContent = 'Grid View';
        } else {
          gridEl.classList.remove('hidden');
          tableWrapperEl.classList.add('hidden');
          viewIcon.className = 'fa-solid fa-table-list text-amber-400';
          viewText.textContent = 'Compare Table';
        }
        updateUI();
      });

      closeModalBtn.addEventListener('click', closeModal);
      modalDoneBtn.addEventListener('click', closeModal);
      modalEl.addEventListener('click', e => {
        if (e.target === modalEl) closeModal();
      });

      // Modal focus trap listener
      modalContent.addEventListener('keydown', e => {
        if (e.key === 'Tab') {
          const focusable = modalContent.querySelectorAll('button:not([disabled]), a[href]:not([disabled]), input:not([disabled]), select:not([disabled])');
          if (focusable.length === 0) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            last.focus();
            e.preventDefault();
          } else if (!e.shiftKey && document.activeElement === last) {
            first.focus();
            e.preventDefault();
          }
        }
      });

      // Global keyboard shortcuts (Escape to close modal, "/" to focus search)
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !modalEl.classList.contains('hidden')) {
          closeModal();
        } else if (e.key === '/' && document.activeElement !== searchInput && modalEl.classList.contains('hidden')) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        }
      });

      // CRT Scanline Mode Toggle with localStorage persistence (Default: ON)
      const crtText = document.getElementById('crtToggleText');
      try {
        const savedCrt = localStorage.getItem('retro_crt_mode');
        const isCrt = savedCrt !== 'disabled';
        if (isCrt) {
          document.body.classList.add('crt-mode');
          if (crtToggleBtn) {
            crtToggleBtn.classList.add('bg-amber-400/20', 'text-amber-300', 'border-amber-400/40');
            crtToggleBtn.classList.remove('bg-studio-900', 'text-slate-300', 'border-studio-border');
            crtToggleBtn.setAttribute('aria-pressed', 'true');
          }
          if (crtText) crtText.textContent = 'CRT Mode: ON';
        } else {
          document.body.classList.remove('crt-mode');
          if (crtToggleBtn) {
            crtToggleBtn.classList.remove('bg-amber-400/20', 'text-amber-300', 'border-amber-400/40');
            crtToggleBtn.classList.add('bg-studio-900', 'text-slate-300', 'border-studio-border');
            crtToggleBtn.setAttribute('aria-pressed', 'false');
          }
          if (crtText) crtText.textContent = 'CRT Mode: OFF';
        }
      } catch (e) {
        document.body.classList.add('crt-mode');
      }

      if (crtToggleBtn) {
        crtToggleBtn.addEventListener('click', () => {
          const isCrt = document.body.classList.toggle('crt-mode');
          crtToggleBtn.setAttribute('aria-pressed', isCrt ? 'true' : 'false');
          try {
            if (isCrt) {
              localStorage.setItem('retro_crt_mode', 'enabled');
              crtToggleBtn.classList.add('bg-amber-400/20', 'text-amber-300', 'border-amber-400/40');
              crtToggleBtn.classList.remove('bg-studio-900', 'text-slate-300', 'border-studio-border');
              if (crtText) crtText.textContent = 'CRT Mode: ON';
            } else {
              localStorage.setItem('retro_crt_mode', 'disabled');
              crtToggleBtn.classList.remove('bg-amber-400/20', 'text-amber-300', 'border-amber-400/40');
              crtToggleBtn.classList.add('bg-studio-900', 'text-slate-300', 'border-studio-border');
              if (crtText) crtText.textContent = 'CRT Mode: OFF';
            }
          } catch (e) {}
        });
      }

      updateUI();
    });
  </script>
</body>
</html>
